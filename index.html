<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landfolio — Theme Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/base.css">
<link rel="stylesheet" href="src/preview.css">
<link rel="stylesheet" href="src/themes-preview.css">
<link rel="stylesheet" href="src/gallery.css">
</head>
<body>

<header>
  <div class="container">
    <div class="top-bar">
      <div class="badge" id="theme-count">0 VARIANTS</div>
      <a href="https://github.com/ctlsim/landfolio" target="_blank" rel="noopener" class="github-link" aria-label="GitHub">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
      </a>
    </div>
    <div class="header-row">
      <div>
        <h1>Landfolio <span>.</span> Theme Gallery</h1>
        <p>Same content. Completely different design directions.</p>
      </div>
      <button type="button" class="search-trigger" id="search-trigger" aria-label="Search themes">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <kbd>⌘K</kbd>
      </button>
    </div>
  </div>
</header>

<div class="container">
  <div class="grid"></div>
</div>

<footer>
  <div class="container">
    <p>All files are single HTML — no build step. Server: <code>python3 -m http.server 3210</code></p>
  </div>
</footer>

<button type="button" class="fab-top" id="fab-top" aria-label="Scroll to top">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="18 15 12 9 6 15"/>
  </svg>
</button>

<!-- Command Palette Overlay -->
<div class="palette-backdrop" id="palette-backdrop"></div>
<div class="palette" id="palette" role="dialog" aria-label="Search themes">
  <div class="palette-input-wrapper">
    <svg class="palette-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <input type="text" id="palette-search" placeholder="Search themes…" autocomplete="off" spellcheck="false">
    <button type="button" class="palette-esc" id="palette-esc" aria-label="Close">esc</button>
  </div>
  <div class="palette-results" id="palette-results"></div>
  <div class="palette-footer">
    <span>↑↓ navigate</span>
    <span>↵ open</span>
    <span>esc close</span>
  </div>
</div>

<script src="src/themes.js"></script>
<script src="src/gallery.js"></script>
</body>
</html>

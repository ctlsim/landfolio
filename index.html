<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landfolio — Theme Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
<style>
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 24px;
  margin-bottom: 16px;
}
.top-bar .badge {
  margin-bottom: 0;
}
.github-link {
  color: #666;
  display: flex;
  align-items: center;
  transition: color 0.2s ease, transform 0.2s ease;
}
.github-link:hover {
  color: #5a4bd6;
  transform: scale(1.05);
}
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  transition: margin-top 0.3s ease;
}
.search-wrapper {
  height: 62px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-end;
}
.search-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
}
.search-bar input {
  width: 100%;
  max-width: 320px;
  padding: 10px 40px 10px 16px;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}
.search-bar input:focus {
  border-color: #999;
}
.search-clear {
  display: none;
  position: absolute;
  right: 12px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  color: #999;
  transition: color 0.15s;
}
.search-clear:hover {
  color: #333;
}
.search-clear svg {
  display: block;
  width: 16px;
  height: 16px;
}
#result-count {
  font-size: 13px;
  color: #888;
  font-weight: 500;
  min-height: 18px;
  display: block;
}
.fab-top {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  opacity: 0;
  transform: translateY(12px);
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s, background 0.15s;
  z-index: 200;
}
.fab-top.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.fab-top:hover {
  background: #5a4bd6;
}
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="top-bar">
      <div class="badge" id="theme-count">0 VARIANTS</div>
      <a href="https://github.com/ctlsim/landfolio" target="_blank" rel="noopener" class="github-link" aria-label="GitHub">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
          <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
        </svg>
      </a>
    </div>
    <div class="header-row">
      <div>
        <h1>Landfolio <span>.</span> Theme Gallery</h1>
        <p>Same content. Completely different design directions.</p>
      </div>
      <div class="search-wrapper">
        <div class="search-bar">
          <input type="text" id="search" placeholder="Search themes,tags…" autocomplete="off">
          <button type="button" class="search-clear" id="search-clear" aria-label="Clear search">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="3" y1="3" x2="13" y2="13"/>
              <line x1="13" y1="3" x2="3" y2="13"/>
            </svg>
          </button>
        </div>
        <span id="result-count"></span>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <div class="grid"></div>
</div>

<footer>
  <div class="container">
    <p>All files are single HTML — no build step. Server: <code>python3 -m http.server 3210</code></p>
  </div>
</footer>

<button type="button" class="fab-top" id="fab-top" aria-label="Scroll to top">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="18 15 12 9 6 15"/>
  </svg>
</button>

<script src="src/themes.js"></script>
<script>
document.getElementById('theme-count').textContent = `${themes.length} VARIANTS`;

const header = document.querySelector('header');
const fabTop = document.getElementById('fab-top');
let ticking = false;
window.addEventListener('scroll', () => {
  if (!ticking) {
    requestAnimationFrame(() => {
      const scrolled = window.scrollY > 50;
      header.classList.toggle('scrolled', scrolled);
      fabTop.classList.toggle('visible', scrolled);
      ticking = false;
    });
    ticking = true;
  }
});

fabTop.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

const searchInput = document.getElementById('search');
const resultCount = document.getElementById('result-count');

const searchClear = document.getElementById('search-clear');

const updateSearch = () => {
  const q = searchInput.value.toLowerCase().trim();
  searchClear.style.display = q ? 'block' : 'none';

  const cards = document.querySelectorAll('.card');
  let visible = 0;

  cards.forEach((card, i) => {
    const theme = themes[i];
    const haystack = `${theme.name} ${theme.desc} ${theme.tags.join(' ')}`.toLowerCase();
    const match = !q || haystack.includes(q);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });

  resultCount.textContent = q ? `${visible} of ${themes.length}` : '';
};

searchInput.addEventListener('input', updateSearch);
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  updateSearch();
});
</script>
</body>
</html>

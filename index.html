<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Landfolio — Theme Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/styles.css">
<style>
.header-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-top: 24px;
  transition: margin-top 0.3s ease;
}
.search-wrapper {
  height: 62px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: flex-end;
}
.search-bar {
  display: flex;
  align-items: center;
  gap: 12px;
  position: relative;
}
.search-bar input {
  width: 100%;
  max-width: 320px;
  padding: 10px 40px 10px 16px;
  border: 1px solid #e0e0e0;
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.2s;
}
.search-bar input:focus {
  border-color: #999;
}
.search-clear {
  display: none;
  position: absolute;
  right: 12px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  color: #999;
  transition: color 0.15s;
}
.search-clear:hover {
  color: #333;
}
.search-clear svg {
  display: block;
  width: 16px;
  height: 16px;
}
#result-count {
  font-size: 13px;
  color: #888;
  font-weight: 500;
  min-height: 18px;
  display: block;
}
.fab-top {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(0,0,0,0.3);
  opacity: 0;
  transform: translateY(12px);
  pointer-events: none;
  transition: opacity 0.2s, transform 0.2s, background 0.15s;
  z-index: 200;
}
.fab-top.visible {
  opacity: 1;
  transform: translateY(0);
  pointer-events: auto;
}
.fab-top:hover {
  background: #5a4bd6;
}
</style>
</head>
<body>

<header>
  <div class="container">
    <div class="badge" id="theme-count">0 VARIANTS</div>
    <div class="header-row">
      <div>
        <h1>Landfolio <span>.</span> Theme Gallery</h1>
        <p>Same content. Completely different design directions.</p>
      </div>
      <div class="search-wrapper">
        <div class="search-bar">
          <input type="text" id="search" placeholder="Search themes,tags…" autocomplete="off">
          <button type="button" class="search-clear" id="search-clear" aria-label="Clear search">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <line x1="3" y1="3" x2="13" y2="13"/>
              <line x1="13" y1="3" x2="3" y2="13"/>
            </svg>
          </button>
        </div>
        <span id="result-count"></span>
      </div>
    </div>
  </div>
</header>

<div class="container">
  <div class="grid"></div>
</div>

<footer>
  <div class="container">
    <p>All files are single HTML — no build step. Server: <code>python3 -m http.server 3210</code></p>
  </div>
</footer>

<button type="button" class="fab-top" id="fab-top" aria-label="Scroll to top">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="18 15 12 9 6 15"/>
  </svg>
</button>

<script src="src/themes.js"></script>
<script>
document.getElementById('theme-count').textContent = `${themes.length} VARIANTS`;

const header = document.querySelector('header');
const fabTop = document.getElementById('fab-top');
let ticking = false;
window.addEventListener('scroll', () => {
  if (!ticking) {
    requestAnimationFrame(() => {
      const scrolled = window.scrollY > 50;
      header.classList.toggle('scrolled', scrolled);
      fabTop.classList.toggle('visible', scrolled);
      ticking = false;
    });
    ticking = true;
  }
});

fabTop.addEventListener('click', () => {
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

const searchInput = document.getElementById('search');
const resultCount = document.getElementById('result-count');

const searchClear = document.getElementById('search-clear');

const updateSearch = () => {
  const q = searchInput.value.toLowerCase().trim();
  searchClear.style.display = q ? 'block' : 'none';

  const cards = document.querySelectorAll('.card');
  let visible = 0;

  cards.forEach((card, i) => {
    const theme = themes[i];
    const haystack = `${theme.name} ${theme.desc} ${theme.tags.join(' ')}`.toLowerCase();
    const match = !q || haystack.includes(q);
    card.style.display = match ? '' : 'none';
    if (match) visible++;
  });

  resultCount.textContent = q ? `${visible} of ${themes.length}` : '';
};

searchInput.addEventListener('input', updateSearch);
searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchInput.focus();
  updateSearch();
});
</script>
</body>
</html>
